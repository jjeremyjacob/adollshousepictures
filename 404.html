<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>404 — Home Pictures</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #090909;
      color: #e8e4dc;
      font-family: Manrope, Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 560px;
    }

    .studio {
      margin: 0 0 70px;
      color: #99958d;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(88px, 18vw, 150px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    .message {
      margin: 30px 0 42px;
      color: #99958d;
      font-size: 13px;
    }

    a {
      display: inline-block;
      color: #e8e4dc;
      font-size: 13px;
      text-decoration: none;
      border-bottom: 1px solid #77736b;
      padding-bottom: 6px;
      overflow-wrap: anywhere;
      transition: opacity 180ms ease;
    }

    a:hover {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="studio">A Doll's House Pictures</p>
    <h1>Unfortunately</h1>
    <p class="message">this page could not be found. Email us for support:</p>
    <a href="mailto:adollshousepictures@gmail.com">adollshousepictures@gmail.com</a>
  </main>
</body>
</html>
