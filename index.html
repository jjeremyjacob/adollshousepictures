<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- ============================================================
         SEO
         ============================================================ -->

    <title>A Doll's House Pictures — Creative Studio</title>

    <meta
        name="description"
        content="A Doll’s House Pictures is an independent creative studio founded by Jeremy Jacob, working across film, video, motion, design, photography, and visual storytelling."
    >

    <meta
        name="keywords"
        content="A Doll's House Pictures, Jeremy Jacob, creative studio, film production, filmmaking, creative direction, photography, motion design, visual storytelling, branded content, commercial film, fashion film, dance film, New York, Hudson Valley"
    >

    <meta
        name="author"
        content="Jeremy Jacob"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://www.adollshousepictures.com/"
    >


    <!-- ============================================================
         FAVICON
         ============================================================ -->

    <link
        rel="icon"
        type="image/webp"
        href="images/adhp.webp"
    >

    <link
        rel="apple-touch-icon"
        href="images/adhp.webp"
    >


    <!-- ============================================================
         OPEN GRAPH
         ============================================================ -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="A Doll's House Pictures — Creative Studio"
    >

    <meta
        property="og:description"
        content="An independent creative studio founded by Jeremy Jacob, working across film, video, motion, design, photography, and visual storytelling."
    >

    <meta
        property="og:url"
        content="https://www.adollshousepictures.com/"
    >

    <meta
        property="og:site_name"
        content="A Doll's House Pictures"
    >

    <meta
        property="og:image"
        content="https://www.adollshousepictures.com/images/og-image.jpg"
    >

    <meta
        property="og:image:alt"
        content="A Doll's House Pictures"
    >

    <meta
        property="og:image:width"
        content="1200"
    >

    <meta
        property="og:image:height"
        content="630"
    >


    <!-- ============================================================
         TWITTER / X
         ============================================================ -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="A Doll's House Pictures — Creative Studio"
    >

    <meta
        name="twitter:description"
        content="An independent creative studio founded by Jeremy Jacob, working across film, video, motion, design, photography, and visual storytelling."
    >

    <meta
        name="twitter:image"
        content="https://www.adollshousepictures.com/images/og-image.jpg"
    >

    <meta
        name="twitter:image:alt"
        content="A Doll's House Pictures"
    >


    <!-- ============================================================
         FONTS
         ============================================================ -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Mono:wght@400&family=Manrope:wght@300;400;500&family=Parisienne&display=swap"
        rel="stylesheet"
    >


    <!-- ============================================================
         CSS
         ============================================================ -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="archive">

      <a
    class="site-logo"
    href="/"
    aria-label="A Doll's House Pictures home"
>
    <img
        src="images/adhplogo.webp"
        alt="A Doll's House Pictures"
    >
</a>


        <!-- ======================================================
             FLOATING ARCHIVE NAVIGATION
             ====================================================== -->

        <aside class="archive-sidebar">


            <header class="archive-header">


                <div class="brand">

                    <span class="brand-main">
                        A Doll's House
                    </span>

                    <span class="brand-serif">
                        Pictures
                    </span>

                </div>


                <div
                    class="archive-total"
                    id="archiveTotal"
                >
                    00
                </div>


            </header>


            <nav
                class="archive-list"
                id="archiveList"
                aria-label="Project archive"
            ></nav>


            <footer class="archive-footer">

                <span>Archive</span>

                <span>2026</span>

            </footer>


        </aside>


        <!-- ======================================================
             FULL PROJECT STAGE
             ====================================================== -->

        <section
            class="project-stage"
            id="projectStage"
        >

            <div
                class="project"
                id="project"
                aria-live="polite"
            ></div>

        </section>


    </main>


    <!-- ============================================================
         VIMEO API
         ============================================================ -->

    <script
        src="https://player.vimeo.com/api/player.js"
    ></script>


    <!-- ============================================================
         SITE JS
         ============================================================ -->

    <script src="script.js"></script>


</body>

</html>
