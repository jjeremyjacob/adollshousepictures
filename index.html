<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A Doll's House Pictures — Film, photography, creative direction and visual work."
    >

    <title>A Doll's House Pictures</title>


    <!-- FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Mono:wght@400&family=Manrope:wght@300;400;500&family=Parisienne&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="archive">


        <!-- ======================================================
             FLOATING ARCHIVE NAVIGATION
             ====================================================== -->

        <aside class="archive-sidebar">


            <header class="archive-header">


                <div class="brand">

                    <span class="brand-main">
                        A Doll's House
                    </span>

                    <span class="brand-serif">
                        Pictures
                    </span>

                </div>


                <div
                    class="archive-total"
                    id="archiveTotal"
                >
                    00
                </div>


            </header>


            <nav
                class="archive-list"
                id="archiveList"
                aria-label="Project archive"
            ></nav>


            <footer class="archive-footer">

                <span>Archive</span>

                <span>2026</span>

            </footer>


        </aside>


        <!-- ======================================================
             FULL PROJECT STAGE
             ====================================================== -->

        <section
            class="project-stage"
            id="projectStage"
        >

            <div
                class="project"
                id="project"
                aria-live="polite"
            ></div>

        </section>


    </main>


    <!-- VIMEO API -->

    <script
        src="https://player.vimeo.com/api/player.js"
    ></script>


    <!-- SITE JS -->

    <script src="script.js"></script>


</body>

</html>
