
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10100f">

<title>A Doll's House Pictures</title>

<meta name="description" content="A Doll's House Pictures. Something is taking shape.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #10100f;
  --ink: #eeeae2;
  --muted: #96938a;
  --line: rgba(238,234,226,.18);
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Manrope", Arial, sans-serif;
  --mono: "DM Mono", monospace;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  padding: 34px 5vw;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.brand {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.04em;
  line-height: 1.25;
}

.brand span {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 400;
}

.status,
.footer {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--muted);
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
  padding: 90px 0;
}

.eyebrow {
  font-family: var(--mono);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  margin-bottom: 30px;
}

h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(64px, 11vw, 142px);
  letter-spacing: -.055em;
  line-height: .82;
  margin: 0;
}

h1 em {
  font-weight: 400;
}

.message {
  margin-top: 42px;
  max-width: 340px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--muted);
}

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}

.footer:last-child {
  text-align: right;
}

@media (max-width: 600px) {
  body {
    padding: 25px 24px;
  }

  main {
    padding: 70px 0;
  }

  h1 {
    font-size: clamp(64px, 15vw, 100px);
  }

  footer {
    gap: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    A DOLL'S HOUSE<br>
    <span>Pictures</span>
  </div>

  <div class="status">Under Construction</div>
</header>

<main>
  <div class="eyebrow">An independent creative studio</div>

  <h1>
    Something<br>
    is <em>taking</em><br>
    shape.
  </h1>

  <p class="message">
    A new home for A Doll's House Pictures is in the works.
    We'll be back before long.
  </p>
</main>

<footer>
  <div class="footer">A Doll's House Pictures</div>
  <div class="footer">New York · 2026</div>
</footer>

</body>
</html>
