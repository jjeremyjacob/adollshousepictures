
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>TIME OFFSET WINDOW</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="controls.css">
  <script src="script.js" defer></script>
  <script src="controls.js" defer></script>
</head>
<body>
  <main class="scroll-track" aria-label="Interactive time-offset video">
    <section class="video-stage" id="video-stage">
      <video
        id="video-base"
        class="video-layer base"
        src="video/1.mp4"
        preload="auto"
        playsinline
        disablepictureinpicture
      ></video>

      <video
        id="time-offset-video"
        class="video-layer offset"
        src="video/1.mp4"
        preload="auto"
        muted
        playsinline
        disablepictureinpicture
        aria-hidden="true"
      ></video>
    </section>
  </main>

  <div class="video-controls" id="video-controls">
    <button
      class="control-button"
      id="play-toggle"
      type="button"
      aria-label="Play video"
    >PLAY</button>

    <span class="time-display" id="current-time">0:00</span>

    <input
      class="seek-bar"
      id="seek-bar"
      type="range"
      min="0"
      max="100"
      step="0.1"
      value="0"
      aria-label="Seek video"
    >

    <span class="time-display" id="duration">0:00</span>

    <button
      class="control-button"
      id="audio-toggle"
      type="button"
      aria-label="Unmute video"
      aria-pressed="false"
    >SOUND OFF</button>

<input
  class="volume-bar"
  id="volume-bar"
  type="range"
  min="0"
  max="1"
  step="0.01"
  value="1"
  aria-label="Video volume"
>

  </div>
</body>
</html>
